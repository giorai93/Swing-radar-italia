<body>
<div class="app">
  <header class="hero">
    <div class="brand"><div class="brand-name">◆ SWING RADAR <span style="color:#62b8ff">ITALIA</span></div><div class="livepill" id="connection">◌ Solo Borsa Italiana</div></div>
    <h1>Scopri i setup.<br><span style="color:#61c4ff">Decidi tu quando entrare.</span></h1>
    <p>Analisi quotidiana direttamente sul telefono. Nessun server, nessun conto broker collegato.</p>
    <div class="hero-bottom"><button class="white-btn" id="scanBtn" onclick="startScan()">↻ &nbsp; Scansiona Milano</button><button class="secondary-btn" onclick="nav('stats')">📊 Statistiche</button><button class="secondary-btn" onclick="nav('data')">Fonte e qualità dati</button></div>
  </header>
  <main class="content">
    <div class="stats">
      <div class="stat"><div class="num blue" id="analysed">–</div><div class="label">Titoli analizzati</div></div>
      <div class="stat"><div class="num green" id="countForce">–</div><div class="label" id="labelForce">Setup forza · 45gg</div></div>
      <div class="stat"><div class="num" id="countWeak">–</div><div class="label" id="labelWeak">Setup debolezza · 45gg</div></div>
    </div>
    <div id="status"></div>
    <section id="view"></section>
    <section id="events"></section>
    <section id="watchlist"></section>
  </main>
  <nav class="nav">
    <button data-tab="radar" class="on" onclick="nav('radar')"><span>◈</span>Radar</button>
    <button data-tab="strategies" onclick="nav('strategies')"><span>◫</span>Strategie</button>
    <button data-tab="titles" onclick="nav('titles')"><span>◇</span>Titoli</button>
    <button data-tab="history" onclick="nav('history')"><span>◷</span>Storico</button>
    <button data-tab="journal" onclick="nav('journal')"><span>▤</span>Diario</button>
    
  </nav>
  <div id="overlay"></div>
</div>
<script>
  'use strict';
  let tab='radar',snapshot={signals:[],trades:[],status:{}},filter='all',period='45d',zoneMode='recent',zonePhase='all',modalSignal=null,fundMode='all',lastSnapshotText='';
  let lifecycleMode='active',journalMode='open',diagTicker='MAIRE',strategyMode='force';
  const esc=v=>String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const euro=(n,d=2)=>Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';
  const fnum=(n,d=1)=>Number(n||0).toLocaleString('it-IT',{maximumFractionDigits:d});
  const segmentLabel=s=>({LARGE:'Large Cap',MID:'Mid Cap',SMALL:'Small Cap',BASE:'Lista base'})[s]||'Segmento N/D';
  const known=n=>typeof n==='number'&&Number.isFinite(n);
  const metric=(n,d=1,suffix='')=>known(n)?fnum(n,d)+suffix:'N/D';
  const lastUpdateIt=value=>{const d=Date.parse(value||'');return Number.isFinite(d)?new Date(d).toLocaleString('it-IT',{timeZone:'Europe/Rome',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'mai';};
  const fundamentals=()=>snapshot.status?.fundamentals||{values:{}};
  const earnings=()=>snapshot.status?.earnings||{values:{},upcoming:[],recent:[]};
  const metricsFor=ticker=>(fundamentals().values||{})[ticker]||null;
  function medianOf(items){const n=items.length;if(!n)return null;items.sort((a,b)=>a-b);return n%2?items[(n-1)/2]:(items[n/2-1]+items[n/2])/2;}
  function peersFor(ticker,col){const m=metricsFor(ticker);if(!m||!m.sector)return null;const peers=Object.entries(fundamentals().values||{}).filter(([t,x])=>t!==ticker&&x.sector===m.sector&&known(x[col])&&x[col]>0).map(([t,x])=>x[col]);return peers.length>=3?medianOf(peers):null;}

  // Tre punteggi indipendenti: non mescoliamo il segnale tecnico con una stima di prezzo.
  function qualityAssessment(ticker){
    const m=metricsFor(ticker);
    if(!m)return {score:null,coverage:0,detail:'Dati fondamentali assenti'};
    const checks=[
      [m.roe_pct, v=>v>=15?100:v>=8?70:v>0?35:0, 'ROE'],
      [m.net_margin_pct,v=>v>=15?100:v>=7?70:v>0?35:0,'Margine netto'],
      [m.cash_conversion,v=>v>=1?100:v>=0.7?70:v>0?35:0,'Cassa operativa / utile'],
      [m.equity_ratio_pct,v=>v>=50?100:v>=30?75:v>=15?40:0,'Patrimonio / attivo']
    ];
    const valid=checks.filter(([v])=>known(v));
    if(valid.length<2)return {score:null,coverage:valid.length,detail:'Copertura insufficiente'};
    const score=Math.round(valid.reduce((sum,[v,fn])=>sum+fn(v),0)/valid.length);
    return {score,coverage:valid.length,detail:'Euristica su '+valid.map(x=>x[2]).join(', ')};
  }
  function relativeValuation(ticker){
    const m=metricsFor(ticker);
    if(!m)return {ratio:null,confidence:'N/D',range:null,count:0,method:'Dati assenti'};
    const candidates=[['P/E','price_earnings_ttm'],['P/B','price_book_fq']];
    const estimates=[];
    for(const [label,col] of candidates){
      const own=m[col],peer=peersFor(ticker,col);
      if(known(own)&&own>0&&known(peer)&&peer>0){
        const r=peer/own;
        if(r>=0.25&&r<=4)estimates.push({name:label,ratio:r});
      }
    }
    if(!estimates.length)return {ratio:null,confidence:'N/D',range:null,count:0,method:'Comparabili insufficienti'};
    const vals=estimates.map(x=>x.ratio).sort((a,b)=>a-b);
    const ratio=vals.reduce((a,b)=>a+b,0)/vals.length;
    const dispersion=vals.length===2?Math.abs(vals[1]-vals[0])/ratio:1;
    const confidence=vals.length>=2&&dispersion<=0.35?'Media':'Bassa';
    const band=confidence==='Media'?0.15:0.30;
    return {ratio,range:[Math.max(0,ratio*(1-band)),ratio*(1+band)],confidence,count:vals.length,method:estimates.map(x=>x.name).join(' + ')};
  }
  function valueAssessment(ticker){
    const m=metricsFor(ticker);
    if(!m||!known(m.eps)||!known(m.price)||m.price<=0||!m.priceDate)return {score:null,coverage:0,detail:'EPS o prezzo assenti'};
    const age=(Date.now()-Date.parse(m.priceDate))/86400000;
    if(!Number.isFinite(age)||age<0||age>7)return {score:null,coverage:0,detail:'Prezzo scaduto'};
    const yieldPct=m.eps/m.price*100;
    return {score:Math.round(Math.max(0,Math.min(100,yieldPct*10))),coverage:1,detail:'Earnings yield annuale '+yieldPct.toFixed(2)+'%; euristica 0–10%'};
  }
  function scoreStrip(ticker,technical){
    const q=qualityAssessment(ticker),v=valueAssessment(ticker);
    const tech=known(technical)?Math.max(0,Math.min(100,Math.round(Number(technical)))):null;
    const cell=(label,val,sub)=>'<div class="score-pillar"><small>'+label+'</small><strong>'+(val===null?'N/D':val+'/100')+'</strong><span>'+esc(sub)+'</span></div>';
    return '<div class="three-scores">'+cell('Qualità',q.score,q.score===null?'Copertura insufficiente':q.coverage+'/4 metriche')+cell('Valutazione',v.score,v.detail)+cell('Timing',tech,tech===null?'Segnale non confermato':'Tecnico')+'</div>';
  }
  function fundamentalsPriority(ticker){
    const q=qualityAssessment(ticker),v=valueAssessment(ticker);
    if(q.score===null||v.score===null)return {score:null,label:'Fondamentali da verificare'};
    return {score:Math.round(q.score*.65+v.score*.35),label:'65% qualità · 35% valutazione'};
  }

  let sortMode='opportunity', minGrowthFilter=0, minQualityFilter=0, undervaluedOnly=false;
  function setSortMode(v){sortMode=v;render();}
  function setMinGrowth(v){minGrowthFilter=Number(v)||0;render();}
  function setMinQuality(v){minQualityFilter=Number(v)||0;render();}
  function setUndervalued(v){undervaluedOnly=!!v;render();}
  function tradeAssessment(s){
    if(!s)return {score:null,coverage:0,label:'N/D',reason:'Nessun segnale'};
    const n=x=>known(x)?x:null;
    const entry=n(s.entry),stop=n(s.stop),target=n(s.target1),rvol=n(s.rvol),raw=n(s.score);
    const direction=entry!==null&&stop!==null&&target!==null&&entry>0&&stop<entry&&target>entry;
    const rr=direction?(target-entry)/(entry-stop):null;
    const risk=direction?(entry-stop)/entry*100:null;
    const trend=raw===null?null:Math.max(0,Math.min(100,raw));
    const setup=trend;
    const volume=rvol===null?null:Math.round(Math.max(0,Math.min(100,45+(rvol-1)*35)));
    const riskReward=rr===null?null:Math.round(Math.max(0,Math.min(100,(rr-0.7)*43)));
    const timing=(!s.asof||s.dataAge===undefined)?null:(Number(s.dataAge)<=2?85:Number(s.dataAge)<=4?55:15);
    const parts=[[trend,.20],[setup,.25],[volume,.20],[riskReward,.20],[timing,.15]];
    const valid=parts.filter(x=>x[0]!==null);
    const coverage=valid.reduce((a,x)=>a+x[1],0);
    if(coverage<.75||!direction||!Number.isFinite(risk)||risk>12)return {score:null,coverage,label:'Da verificare',reason:'Livelli, copertura o rischio non idonei',rr};
    let score=Math.round(valid.reduce((a,x)=>a+x[0]*x[1],0)/coverage);
    const lifecycle=lifecycleGroup(s);
    if(lifecycle!=='active')score=Math.min(score,35);
    if(rr<1.5)score=Math.min(score,49);
    if(Number(s.dataAge)>4)score=Math.min(score,50);
    return {score,coverage,label:score>=80?'Setup forte':score>=65?'Interessante':score>=50?'In osservazione':'Debole',reason:'Score euristico, non probabilità di successo',rr};

  function opportunityAssessment(s){

    if([q.score,g.score,v.score,t.score].some(x=>x===null))return {score:null,reason:'Dati incompleti'};
    let score=Math.round(.25*q.score+.20*g.score+.20*v.score+.35*t.score);
    if(t.score<50)score=Math.min(score,49);

  // A signal can satisfy the same conditions on several consecutive closes.
  // Treat those observations as one research idea while preserving every raw

  function consolidateSignals(raw){
    const ordered=[...(raw||[])].filter(s=>s&&s.ticker&&s.asof&&['FORZA','DEBOLEZZA'].includes(s.kind))
      .sort((a,b)=>a.asof.localeCompare(b.asof)||a.ticker.localeCompare(b.ticker));
    const recent=new Map(),episodes=[];
    for(const s of ordered){
      const key=s.ticker+'|'+s.kind,previous=recent.get(key);
      const gap=previous?(Date.parse(s.asof+'T12:00:00Z')-Date.parse(previous.last.asof+'T12:00:00Z'))/86400000:Infinity;
      // A previously completed trade can legitimately be followed by a new idea.
      const closedBeforeNext=previous&&lifecycleGroup(previous.last)!=='active'&&
        previous.last.stateAt&&previous.last.stateAt<=s.asof;
      if(previous&&gap>=0&&gap<=7&&!closedBeforeNext){
        previous.last=s;previous.days.push(s.asof);
      }else{
        const episode={first:s,last:s,days:[s.asof]};episodes.push(episode);recent.set(key,episode);
      }
    }
    return episodes.map(e=>({...e.last,episodeCount:e.days.length,episodeStart:e.first.asof,
      episodeDates:e.days}));
  }

  function renderTickerDiagnostic(){

    let rows=[['Ticker',result.ticker],['Esito',String(result.status||'N/D').replace(/_/g,' ')],['Ultima seduta',result.asof||'N/D'],['Motivo',result.reason||'N/D']];

  }

nal(\''+esc(s.ticker)+'\',\''+esc(s.asof)+'\',\''+esc(s.kind)+'\')">Dettagli e diario →</button></div></article>';}

    return out+'<div class="section"><p>Multipli e margini sono descrittivi; non usiamo una valutazione sintetica senza confronto e copertura settoriale sufficienti. Il filtro tecnico rimane indipendente.</p></div>';
  }
  function closeModal(event){if(!event||event.target.classList.contains('modal-backdrop'))document.getElementById('overlay').innerHTML='';}
  function setJournalMode(value){journalMode=value;render();}
  function renderJournal(){const trades=snapshot.trades||[];let closed=trades.filter(t=>t.exit!==null&&t.exit!==undefined),opened=trades.filter(t=>t.exit===null||t.exit===undefined),pnl=closed.reduce((a,t)=>a+Number(t.pnl||0),0);
    let out='<div class="topline"><h2>Posizioni reali · diario</h2><small>'+trades.length+' operazioni manuali</small></div><div class="section"><div class="detail-line"><span>Posizioni aperte</span><strong>'+opened.length+'</strong></div><div class="detail-line"><span>Posizioni chiuse</span><strong>'+closed.length+'</strong></div><div class="detail-line"><span>Risultato realizzato*</span><strong style="color:'+(pnl>=0?'#0d996e':'#c83c52')+'">'+euro(pnl)+'</strong></div><p style="margin-top:11px">* P&L lordo delle imposte, al netto delle commissioni inserite. L’app non controlla il broker: apertura e chiusura vanno registrate da te.</p></div>';
    out+='<button class="action" style="width:100%;margin-bottom:12px;padding:13px" onclick="nav(\'stats\')">📊 Esplora statistiche e risultati teorici dei setup →</button>';
    out+='<div class="chips"><button class="chip '+(journalMode==='open'?'sel':'')+'" onclick="setJournalMode(\'open\')">Aperte ('+opened.length+')</button><button class="chip '+(journalMode==='closed'?'sel':'')+'" onclick="setJournalMode(\'closed\')">Chiuse ('+closed.length+')</button><button class="chip '+(journalMode==='all'?'sel':'')+'" onclick="setJournalMode(\'all\')">Tutte</button></div><button class="primary" onclick="tradeFromSignal(null)">+ Registra acquisto reale</button>';
    const chosen=journalMode==='open'?opened:journalMode==='closed'?closed:trades;
    if(!chosen.length)return out+'<div class="empty" style="margin-top:15px"><span class="bigicon">▤</span>Nessuna posizione in questa categoria. I segnali del radar non sono ordini eseguiti.</div>';
    chosen.forEach(t=>{const open=t.exit===null||t.exit===undefined;out+='<div class="trade"><div class="tradehead"><strong>'+esc(t.ticker)+' · '+esc(t.kind)+'</strong>'+(open?'<small>APERTA · registrata manualmente</small>':'<span class="'+(t.pnl>=0?'profit':'profit loss')+'">'+euro(t.pnl)+'</span>')+'</div><div style="margin:11px 0;font-size:12px">'+esc(t.quantity)+' pz · Entrata '+euro(t.entry,3)+(open?'':' · Uscita '+euro(t.exit,3))+'</div><small>Commissioni totali: '+euro(t.fees)+' · '+esc(t.note||'')+'</small>'+(open?'<div style="margin-top:10px"><button class="action" onclick="closeTradeDialog('+Number(t.id)+')">Registra vendita / chiudi</button></div>':'')+'</div>';});return out;
  }
  function tradeFromSignal(s=modalSignal){if(s&&s.ticker===undefined)s=null;document.getElementById('overlay').innerHTML='<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal"><div class="modal-header"><h2>Registra acquisto</h2><button class="xbtn" onclick="closeModal()">×</button></div><form onsubmit="submitTrade(event)"><div class="formgrid"><div class="formrow"><label>Ticker (Milano)</label><input id="tTicker" maxlength="12" required value="'+esc(s?s.ticker:'')+'" placeholder="ENI"></div><div class="formrow"><label>Setup</label><select id="tKind"><option '+(s&&s.kind==='FORZA'?'selected':'')+'>FORZA</option><option '+(s&&s.kind==='DEBOLEZZA'?'selected':'')+'>DEBOLEZZA</option><option '+(!s?'selected':'')+'>MANUALE</option></select></div><div class="formrow"><label>Prezzo ingresso (€)</label><input id="tEntry" type="number" inputmode="decimal" step="0.0001" min="0.0001" required value="'+(s?s.entry:'')+'"></div><div class="formrow"><label>Quantità</label><input id="tQty" type="number" inputmode="decimal" step="0.001" min="0.001" required></div></div><div class="formrow"><label>Commissione acquisto (€)</label><input id="tFees" type="number" step="0.01" min="0" value="0"></div><div class="formrow"><label>Note</label><textarea id="tNote" rows="3" placeholder="Motivo d’ingresso / decisione"></textarea></div><button class="primary" type="submit">Salva nel diario locale</button></form></div></div>';}
  function submitTrade(e){e.preventDefault();const t={ticker:document.getElementById('tTicker').value,kind:document.getElementById('tKind').value,entry:Number(document.getElementById('tEntry').value),quantity:Number(document.getElementById('tQty').value),fees:Number(document.getElementById('tFees').value),note:document.getElementById('tNote').value};const result=Android.addTrade(JSON.stringify(t));if(result.startsWith('ERRORE')){alert(result);return;}closeModal();nav('journal');update();}
  function closeTradeDialog(id){document.getElementById('overlay').innerHTML='<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal"><div class="modal-header"><h2>Chiudi operazione #'+id+'</h2><button class="xbtn" onclick="closeModal()">×</button></div><form onsubmit="submitCloseTrade(event,'+id+')"><div class="formrow"><label>Prezzo di vendita (€)</label><input id="exitPrice" type="number" required step="0.0001" min="0.0001"></div><div class="formrow"><label>Commissioni vendita (€)</label><input id="exitFees" type="number" step="0.01" min="0" value="0"></div><button class="primary" type="submit">Conferma chiusura</button></form></div></div>';}
  function submitCloseTrade(e,id){e.preventDefault();const result=Android.closeTrade(id,Number(document.getElementById('exitPrice').value),Number(document.getElementById('exitFees').value));if(result.startsWith('ERRORE')){alert(result);return;}closeModal();update();}
  function renderData(){const s=snapshot.status||{},f=fundamentals();
    let out='<div class="topline"><h2>Motore e dati</h2><small>Solo Borsa Italiana</small></div>';
    out+='<div class="section"><h3>Stato feed</h3><div class="detail-line"><span>Prezzi giornalieri</span><strong>Yahoo Chart · .MI · non live</strong></div><div class="detail-line"><span>Storici in cache</span><strong>'+esc(snapshot.cachedStocks||0)+'</strong></div><div class="detail-line"><span>Ultimo controllo</span><strong>'+esc(lastUpdateIt(s.lastRun))+'</strong></div><div class="detail-line"><span>Ultima seduta disponibile</span><strong>'+esc(s.report?.lastSession||'N/D')+'</strong></div><div class="detail-line"><span>Seduta attesa (lun–ven)</span><strong>'+esc(s.expectedSession||'N/D')+'</strong></div><div class="detail-line"><span>Prezzi arretrati</span><strong>'+esc(s.report?.staleQuoteCount||0)+' ticker</strong></div><div class="detail-line"><span>Scansione</span><strong>'+esc(s.done||0)+' / '+esc(s.total||'?')+'</strong></div><div class="detail-line"><span>Fondamentali disponibili</span><strong>'+esc(f.count||0)+' titoli</strong></div><div class="detail-line"><span>Trimestrali in calendario</span><strong>'+esc((earnings().upcoming||[]).length)+' entro 14 giorni</strong></div><div class="detail-line"><span>Fonte eventi aggiornata</span><strong>'+esc(earnings().updatedAt?new Date(earnings().updatedAt).toLocaleString('it-IT'):'mai')+'</strong></div>'+(earnings().lastError?'<p>Errore calendario: '+esc(earnings().lastError)+'</p>':'')+'<p style="margin-top:14px">Questa app analizza <strong>candele giornaliere completate</strong>, non le quotazioni intraday di TradingView. La seduta attesa si basa sui giorni feriali: festività ed eventuali ritardi del provider possono incidere.</p></div>';
    if((s.report?.staleQuotes||[]).length)out+='<div class="section"><h3>Titoli con ultima candela arretrata</h3>'+(s.report.staleQuotes||[]).slice(0,30).map(x=>'<div class="detail-line"><strong>'+esc(x.ticker)+'</strong><span>'+esc(x.asof)+' · atteso '+esc(s.expectedSession||'')+'</span></div>').join('')+'</div>';
    out+='<div class="section"><h3>↗ Acquisto sulla forza</h3><ul class="small-list"><li>Prezzo sopra SMA200 e SMA50 sopra SMA200</li><li>Chiusura sopra il massimo delle precedenti 20 sedute (+0,5%)</li><li>Consolidamento profondo al massimo 22%</li><li>Volume ≥1,3× mediana 20 sedute</li><li>Chiusura nella parte alta della candela (≥65%)</li></ul></div>';
    out+='<div class="section"><h3>↘ Acquisto sulla debolezza</h3><ul class="small-list"><li>Prezzo sopra SMA200 e SMA50 sopra SMA200</li><li>Performance 60 sedute oltre +4%</li><li>Pullback 3,5–14% dal massimo 20 sedute</li><li>RSI(2) ≤25</li><li>Distanza dal supporto SMA20 o SMA50 ≤3,5%</li></ul></div>';
    out+='<div class="section"><h3>⌁ Recupero da debolezza · in osservazione</h3><ul class="small-list"><li>Prezzo sotto SMA200 e calo a 60 sedute almeno 8%</li><li>Distanza massima del 20% dal minimo delle precedenti 120 sedute</li><li>Almeno 3 condizioni aggiuntive su 4: zona entro +12% dal minimo, calo 60gg almeno 12%, RSI(2) ≤70, chiusura nella metà superiore della candela</li><li>Stop teorico sotto il supporto e rischio prezzo massimo del 18%</li><li>Storico di 35 sedute: viene conservata la zona più recente per titolo, anche se ora il prezzo è cambiato</li></ul><p>Questa è solo una lista di osservazione: non produce notifiche d’ingresso, non anticipa risultati societari e non è validata fuori campione.</p></div>';
    out+='<div class="section"><h3>◷ Eventi trimestrali</h3><p>Calendario informativo dei risultati attesi entro 14 giorni, più gli ultimi 5 giorni. Le date dello screener possono essere stimate e devono essere confermate sulla pagina Investor Relations dell’emittente. Nessun acquisto viene segnalato per il solo avvicinarsi di un evento.</p></div>';
    out+='<div class="section"><h3>Universo dinamico Italia</h3><p>La versione 1.4 aggiunge automaticamente le azioni Milano liquide dallo screener. Fasce indicative: Large Cap ≥10 mld €, Mid Cap 2–10 mld €, Small Cap 100 mln–2 mld €. Turnover giornaliero medio richiesto in selezione: 500.000 € Large/Mid e 250.000 € Small. L’elenco locale storico è sempre mantenuto. La scoperta è aggiornata circa ogni 24 ore; in caso di errore si usa la cache o la lista base. Screener non ufficiale e soggetto a disponibilità.</p></div>';
    out+='<div class="section"><h3>Parametri comuni</h3><p>Prezzo ≥1 €; turnover mediano a 20 sedute ≥500.000 € per Large/Mid/lista base oppure ≥250.000 € per Small; almeno 210 sedute di storico. Prima delle 18:15 italiane la candela odierna è esclusa: si analizza l’ultima seduta completata. Stop/target ATR(14). I setup sono confermati solo se rispettano tutte le regole; quelli in formazione mostrano il conteggio delle condizioni superate.</p></div>';
    out+='<div class="section"><h3>Analisi fondamentale</h3><p>I dati reali (P/E, P/B, ROE, ricavi, margini, leverage e settore) sono visibili nel menu Bilanci. Sono informativi e non bloccano i setup tecnici. Il confronto settoriale viene mostrato solo quando ci sono almeno tre società comparabili nel nostro paniere.</p></div>';
    out+='<div class="section"><h3>Autonomia Android</h3><p>Le analisi avvengono sul telefono, con Internet e senza server privato. JobScheduler può posticipare la scansione giornaliera per batteria o inattività. Non c’è esecuzione di ordini, né feed intraday.</p></div>';
    return out+'<div class="section"><h3>Limiti</h3><p>Questa replica non è una strategia proprietaria certificata e non è stata validata fuori campione sull’universo italiano. I dati dei bilanci possono essere ritardati o assenti. Prima di usare capitale reale occorre un backtest con commissioni, spread e slippage.</p></div>';
  }
  setInterval(update,2200);
  // Re-check the 18:15 EOD cutoff even when the app stays open all afternoon.
  setInterval(()=>{try{if(window.Android&&typeof Android.refreshIfDue==='function')Android.refreshIfDue();}catch(e){}},60000);
  update();
</script>
<script src="chart.js"></script>
<script src="stats.js"></script>
</body>

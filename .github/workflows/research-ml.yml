name: Italian ML research verification
on:
  push:
    branches: ['research/italy-ml-v1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r project/research/requirements.txt
      - run: python -m unittest discover -s project/research -p 'test_*.py'
      - name: Replay actual saved market samples
        run: python project/research/italy_ml.py --replay project/research/snapshots/samples.csv.gz --out /tmp/ml-replay
      - name: Match locally executed results
        run: |
          python - <<'PY'
          import json, math
          a=json.load(open('project/research/snapshots/report.json'))
          b=json.load(open('/tmp/ml-replay/replay_report.json'))
          for method,metrics in a['overall'].items():
              for key in ['trades','periods','mean_net_pct','mean_gross_pct','win_rate_pct','profit_factor']:
                  assert math.isclose(metrics[key],b['overall'][method][key],rel_tol=1e-7,abs_tol=1e-9),(method,key)
          print('Saved-sample results reproduced')
          PY
      - name: Replay capital-constrained portfolio validation
        run: python project/research/portfolio_validation.py --out /tmp/portfolio-replay
      - name: Verify portfolio results and reserved-period gate
        run: |
          python - <<'PYCODE'
          import json, math
          a=json.load(open('project/research/validation/report.json'))
          b=json.load(open('/tmp/portfolio-replay/report.json'))
          for scenario,metrics in a['reports'].items():
              for key in ['final_equity_eur','return_pct','max_daily_drawdown_pct','fees_eur','trades']:
                  assert math.isclose(metrics[key],b['reports'][scenario][key],rel_tol=1e-9,abs_tol=1e-7),(scenario,key)
          assert b['gate']['final_2026_test_executed'] is False
          print('All capital-constrained scenarios reproduced; 2026 remains reserved')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: italian-ml-replay
          path: |
            /tmp/ml-replay/
            /tmp/portfolio-replay/

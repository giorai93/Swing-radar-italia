
name: Build Swing Radar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract project
        run: unzip -q SwingRadar3_Android_NUOVO.zip -d project
      - name: Build APK
        run: bash project/build_apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Swing-Radar-Italia-3.0
          path: project/Swing_Radar_Italia_3.0.apk

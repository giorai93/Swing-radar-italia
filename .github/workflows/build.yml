name: Build Swing Radar APK
on:
  push:
    branches: [main]
    paths-ignore: ['project/assets/fundamentals.json']
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 1-5'
permissions:
  contents: write
concurrency:
  group: android-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml==6.0.2
      - name: Parser and score regression tests
        run: |
          python -m unittest discover -s project/tests -p 'test_esef.py' -v
          cd project
          node tests/fundamentals_smoke.js
      - name: Fetch and verify real GVS and SOL ESEF reports
        run: python project/tools/esef.py --strict
      - name: Verify live facts
        run: python project/tests/verify_live.py
      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esef-verification
          path: project/assets/fundamentals.json
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: bash project/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Swing-Radar-Italia-3.0
          path: project/Swing_Radar_Italia_3.0.apk
          if-no-files-found: error
      - name: Publish verified dataset for installed apps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/assets/fundamentals.json
          git diff --cached --quiet || git commit -m 'Refresh verified ESEF dataset [skip ci]'
          git push
